{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>Create a New Note</h2>
    <!-- enctype is CRITICAL for file uploads -->
    <form action="{{ url_for('add_note') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" required placeholder="e.g., Chapter 4: AWS Compute">
        </div>

        <div class="form-group">
            <label>Subject</label>
            <input type="text" name="subject" required placeholder="e.g., Cloud Computing, Math, History">
        </div>

        <div class="form-group">
            <label>Study Notes</label>
            <textarea name="content" rows="6" required placeholder="Type your summary here..."></textarea>
        </div>

        <div class="form-group upload-box">
            <label>Attach PDF / Document (Optional)</label>
            <input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.docx">
        </div>

        <button type="submit" class="btn-submit">Save Note</button>
    </form>
</div>
{% endblock %}
